name: Keep API awake
# Render's free plan sleeps after 15 idle minutes; a sleeping API makes crawlers and
# prerendering see empty pages. Ping the health check every 10 minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health check
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://blogsphere-api-odr7.onrender.com/api/v1/health
